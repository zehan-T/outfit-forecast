<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cold accessory alignment preview</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      body { padding-block: 2rem; }
      main { width: min(calc(100% - 2rem), 36rem); }
    </style>
  </head>
  <body>
    <main>
      <section class="character-panel" aria-label="Cold accessory alignment preview">
        <div class="character-frame">
          <div class="character-stage">
            <img id="character-image" src="../assets/characters/final/character-cold-c.png" alt="Character in a cold-weather outfit">
            <div class="wearable-layers" aria-hidden="true">
              <img class="accessory-layer accessory-cold-wind-scarf-gloves" src="../assets/accessories/final/cold-wind-scarf-gloves.png" alt="">
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
