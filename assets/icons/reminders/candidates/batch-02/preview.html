<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f0e8; color: #26324a; font: 600 26px/1.2 system-ui, sans-serif; }
  main { width: 1000px; height: 560px; padding: 64px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 38px; }
  figure { margin: 0; display: grid; place-items: center; align-content: center; gap: 28px; background: #fffaf2; border: 3px solid #d6c8b1; border-radius: 28px; box-shadow: 0 12px 30px #26324a18; }
  img.icon { width: 170px; height: 170px; }
  img.motif { width: 280px; height: 170px; }
  figcaption { text-align: center; }
</style>
<main>
  <figure><img class="icon" src="thunder-safety.svg"><figcaption>6 雷暴安全</figcaption></figure>
  <figure><img class="motif" src="../../../../motif/candidates/batch-01/music-weather-motif.svg"><figcaption>音乐天气装饰图案</figcaption></figure>
</main>
</html>
