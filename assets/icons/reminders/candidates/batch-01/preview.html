<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f0e8; color: #26324a; font: 600 23px/1.2 system-ui, sans-serif; }
  main { width: 1400px; height: 560px; padding: 64px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px; }
  figure { margin: 0; display: grid; place-items: center; align-content: center; gap: 28px; background: #fffaf2; border: 3px solid #d6c8b1; border-radius: 28px; box-shadow: 0 12px 30px #26324a18; }
  img { width: 150px; height: 150px; }
  figcaption { text-align: center; padding: 0 8px; }
</style>
<main>
  <figure><img src="umbrella.svg"><figcaption>1 带雨伞</figcaption></figure>
  <figure><img src="sun-protection.svg"><figcaption>2 注意防晒</figcaption></figure>
  <figure><img src="water.svg"><figcaption>3 带水</figcaption></figure>
  <figure><img src="wind-layer.svg"><figcaption>4 防风保暖</figcaption></figure>
  <figure><img src="waterproof-footwear.svg"><figcaption>5 防水鞋／冰雪</figcaption></figure>
</main>
</html>
