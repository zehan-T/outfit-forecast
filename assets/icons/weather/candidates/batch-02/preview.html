<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f0e8; color: #26324a; font: 600 25px/1.2 system-ui, sans-serif; }
  main { width: 1400px; height: 560px; padding: 64px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px; }
  figure { margin: 0; display: grid; place-items: center; align-content: center; gap: 28px; background: #fffaf2; border: 3px solid #d6c8b1; border-radius: 28px; box-shadow: 0 12px 30px #26324a18; }
  img { width: 150px; height: 150px; }
  figcaption { text-align: center; }
</style>
<main>
  <figure><img src="rain.svg"><figcaption>6 雨</figcaption></figure>
  <figure><img src="freezing-rain.svg"><figcaption>7 冻雨</figcaption></figure>
  <figure><img src="snow.svg"><figcaption>8 雪</figcaption></figure>
  <figure><img src="showers.svg"><figcaption>9 阵雨</figcaption></figure>
  <figure><img src="thunder.svg"><figcaption>10 雷暴</figcaption></figure>
</main>
</html>
